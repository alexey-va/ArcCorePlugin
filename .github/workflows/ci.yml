name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: arccore-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-package-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "25"
      - name: Verify arc-core provider-host architecture
        uses: alexey-va/arc-core/.github/actions/verify-consumer@5b785b5af561bc794e1702c0b5e05edf8b1c317d
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Test, package and stage the standalone host
        run: ./gradlew --no-daemon --build-cache test shadowJar publishRuntimePluginPublicationToStagingRepository
      - name: Preserve lifecycle test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ArcCore-reports-${{ github.sha }}
          retention-days: 7
          path: |
            build/reports/tests/test/
            build/test-results/test/
          if-no-files-found: warn
      - name: Verify provider ownership and staged artifact
        run: python3 scripts/verify-artifact.py
      - name: Preserve tested production JAR and checksum
        run: |
          version=$(sed -n 's/^pluginVersion=//p' gradle.properties)
          (cd build/libs && sha256sum "ArcCore-$version.jar" > SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ArcCore-${{ github.sha }}
          retention-days: 7
          path: |
            build/libs/ArcCore-*.jar
            !build/libs/*-plain.jar
            build/libs/SHA256SUMS
          if-no-files-found: error
      - name: Publish immutable runtime artifact
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          REPOSILITE_PUBLISH_PASSWORD: ${{ secrets.REPOSILITE_PUBLISH_PASSWORD }}
        run: |
          version=$(sed -n 's/^pluginVersion=//p' gradle.properties)
          ./scripts/publish-staged-maven.sh build/release-repository \
            "ru/ruscrafting/ArcCore/$version/ArcCore-$version.jar" \
            "ru/ruscrafting/ArcCore/$version/ArcCore-$version.pom"
